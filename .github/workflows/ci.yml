name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Build image and smoke-test
        run: |
          docker build -t fastapi-ocr .
          docker run -d --name test -p 8000:8000 fastapi-ocr
          trap 'docker rm -f test' EXIT
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          curl -fs http://localhost:8000/health
          curl -fs http://localhost:8000/ > /dev/null
