name: CI + local deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build image and smoke-test
        run: |
          docker build -t fastapi-ocr .
          docker run -d --name test -p 8000:8000 fastapi-ocr
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/docs > /dev/null && break
            sleep 1
          done
          curl -f http://localhost:8000/docs
          docker rm -f test

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy container locally
        run: |
          docker build -t fastapi-ocr .
          docker rm -f fastapi-ocr || true
          docker run -d --restart unless-stopped --name fastapi-ocr -p 8000:8000 fastapi-ocr