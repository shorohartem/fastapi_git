name: CI for FastAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t fastapi-ocr .

      - name: Run container and check /docs
        run: |
          docker run -d --name fastapi -p 8000:8000 fastapi-ocr
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/docs > /dev/null; then
              echo "✅ Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Server did not start in time"
          docker logs fastapi
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f fastapi || true